name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sast-semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep on real project
        run: |
          mkdir -p reports
          semgrep scan --config .semgrep/security-rules.yml . \
            --exclude security-demo \
            --json \
            --output reports/semgrep-ci-report.json

      - name: Run Semgrep on demo vulnerabilities
        continue-on-error: true
        run: |
          semgrep scan --config .semgrep/security-rules.yml security-demo \
            > reports/semgrep-ci-demo-report.txt

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: reports/semgrep-ci-*

  sca-dotnet:
    name: SCA - NuGet vulnerable packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Scan solution dependencies
        run: |
          mkdir -p reports
          dotnet list ApplicantSystem.slnx package --vulnerable --include-transitive \
            > reports/sca-ci-solution.txt

      - name: Scan demo vulnerable dependency
        continue-on-error: true
        run: |
          dotnet list security-demo/sca-vulnerable/sca-vulnerable.csproj package --vulnerable --include-transitive \
            > reports/sca-ci-demo-vulnerable.txt

      - name: Upload SCA reports
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: reports/sca-ci-*

  dast-zap:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Start WebApp
        run: |
          mkdir -p reports
          nohup dotnet run --project WebApp/WebApp.csproj --urls http://localhost:5000 > webapp.log 2>&1 &
          sleep 25

      - name: Check WebApp is running
        run: |
          curl -I http://localhost:5000

      - name: Run ZAP Baseline Scan
        run: |
          docker run --rm --network=host \
            -v ${{ github.workspace }}/reports:/zap/wrk \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -r zap-ci-report.html \
            -w zap-ci-report.md \
            -J zap-ci-report.json \
            -a || true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: reports/zap-ci-report.*

      - name: Upload WebApp log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-log
          path: webapp.log
